name: Build and Deploy Frontend & Backend to Azure Web App (Container)

on:
  push:
    branches:
      - main
      - staging
  pull_request:
    branches:
      - main
      - staging

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    name: CI Pipeline - Test and Build

    env:
      BACKEND_PORT: 8000

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup frontend
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build --if-present

      - name: Setup backend
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Add backend tests here if available

  build-and-deploy:
    runs-on: ubuntu-latest
    needs: build-and-test
    name: Build Docker Images and Deploy

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ secrets.AZURE_REGISTRY_LOGIN_SERVER }}
          username: ${{ secrets.AZURE_REGISTRY_USERNAME }}
          password: ${{ secrets.AZURE_REGISTRY_PASSWORD }}

      - name: Build Frontend Docker image
        run: docker build -f frontend/Dockerfile -t ${{ secrets.AZURE_REGISTRY_LOGIN_SERVER }}/frontend:latest ./frontend

      - name: Build Backend Docker image
        run: docker build -f backend/Dockerfile -t ${{ secrets.AZURE_REGISTRY_LOGIN_SERVER }}/backend:latest ./backend

      - name: Push Frontend image
        run: docker push ${{ secrets.AZURE_REGISTRY_LOGIN_SERVER }}/frontend:latest

      - name: Push Backend image
        run: docker push ${{ secrets.AZURE_REGISTRY_LOGIN_SERVER }}/backend:latest

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          images: |
            ${{ secrets.AZURE_REGISTRY_LOGIN_SERVER }}/frontend:latest
            ${{ secrets.AZURE_REGISTRY_LOGIN_SERVER }}/backend:latest
